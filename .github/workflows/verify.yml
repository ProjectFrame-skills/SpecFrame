name: Verify SpecFrame

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            node-version: '18'
          - python-version: '3.13'
            node-version: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: npm CLI installation tests
        run: npm test
      - name: npm package contents
        run: npm pack --dry-run
      - name: State and recovery tests
        run: python3 -m unittest discover -s tests -v
      - name: Isolated installation
        run: |
          destination_root=$(mktemp -d)
          python3 tools/install_specframe.py --destination "$destination_root/specframe" --hooks "$destination_root/hooks.json"
          diff -r --exclude='__pycache__' --exclude='*.pyc' skills/specframe "$destination_root/specframe"
