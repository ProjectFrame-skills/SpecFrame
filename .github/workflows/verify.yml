name: Verify SpecFrame

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: State and recovery tests
        run: python3 -m unittest discover -s tests -v
      - name: Isolated installation
        run: |
          destination_root=$(mktemp -d)
          python3 tools/install_specframe.py --destination "$destination_root/specframe" --hooks "$destination_root/hooks.json"
          diff -r --exclude='__pycache__' --exclude='*.pyc' skills/specframe "$destination_root/specframe"
